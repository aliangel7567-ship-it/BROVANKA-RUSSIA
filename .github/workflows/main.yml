name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Auto-Fix Broken Old Code
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { gradlePluginPortal(); google(); mavenCentral() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } } }
          rootProject.name = "SA-MP Launcher"
          include ':app'
          EOF
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral(); maven { url 'https://artifacts.applovin.com/android' }; maven { url 'https://jitpack.io' } }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.1'
                  classpath 'com.google.gms:google-services:4.3.15'
                  classpath 'com.google.firebase:firebase-crashlytics-gradle:2.2.0'
              }
          }
          allprojects { repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' }; maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' } } }
          task clean(type: Delete) { delete rootProject.buildDir }
          EOF
          
      - name: Build Android App
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: BROVANKA-RUSSIA-APK
          path: app/build/outputs/apk/debug/*.apk
